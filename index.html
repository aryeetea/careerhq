<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf3ea" />
    <meta name="application-name" content="Bloom" />
    <meta name="apple-mobile-web-app-title" content="Bloom" />
    <!-- PWA installability — vite-plugin-pwa emits manifest.webmanifest
         from the `manifest` config in vite.config.ts at build time. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS ignores the manifest's display/icons — needs its own tags to
         install as a standalone (no browser chrome) app with a real icon
         instead of a screenshot thumbnail. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Bloom — a calm, elegant space to grow your career. Save roles worth pursuing, nurture every application, and celebrate progress as it happens." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bloomcircle.vercel.app" />
    <meta property="og:title" content="Bloom — grow your career, gently" />
    <meta property="og:description" content="Bloom is a calm, elegant space to grow your career — save roles worth pursuing, nurture every application, and celebrate progress as it happens." />
